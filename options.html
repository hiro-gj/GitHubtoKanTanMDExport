<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>かんたんMarkdown変換 拡張機能設定</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f6f8fa;
      color: #24292f;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid #d0d7de;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .radio-group {
      margin-bottom: 8px;
    }
    .radio-group label {
      display: inline-block;
      font-weight: normal;
      margin-right: 15px;
      cursor: pointer;
    }
    .text-input {
      width: 100%;
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-sizing: border-box;
      margin-top: 4px;
    }
    .text-input:disabled {
      background-color: #f6f8fa;
      color: #57606a;
      cursor: not-allowed;
    }
    .button-group {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(27, 31, 36, 0.15);
    }
    .btn-primary {
      color: #ffffff;
      background-color: #2da44e;
    }
    .btn-primary:hover {
      background-color: #2c974b;
    }
    .btn-secondary {
      color: #24292f;
      background-color: #f6f8fa;
    }
    .btn-secondary:hover {
      background-color: #f3f4f6;
    }
    .btn-secondary:disabled {
      color: #8c959f;
      cursor: not-allowed;
    }
    #test-result {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .success {
      color: #1a7f37;
    }
    .error {
      color: #cf222e;
    }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #24292f;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .info-link {
      font-size: 13px;
      color: #0969da;
      text-decoration: none;
      display: block;
      margin-top: -12px;
      margin-bottom: 20px;
    }
    .info-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>かんたんMarkdown変換 拡張機能設定</h1>
    <a href="https://github.com/tatesuke/KanTanMarkdown" target="_blank" class="info-link">かんたんMarkdown 公式リポジトリはこちら</a>

    <div class="form-group">
      <label>かんたんMarkdownリポジトリ選択</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="repo_type" value="original" checked> オリジナル(tatesuke)
        </label>
        <label>
          <input type="radio" name="repo_type" value="custom"> その他（カスタムリポジトリURL入力）
        </label>
      </div>
      <input type="text" id="custom_repo_url" class="text-input" placeholder="https://github.com/ユーザー名/リポジトリ名" disabled>
      <div id="test-result"></div>
    </div>

    <div class="form-group">
      <label>エディション選択</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="edition" value="lite" checked> Liteエディション
        </label>
        <label>
          <input type="radio" name="edition" value="standard"> Standardエディション
        </label>
        <label>
          <input type="radio" name="edition" value="full"> Fullエディション
        </label>
      </div>
    </div>

    <div class="button-group">
      <button id="save-btn" class="btn btn-primary">保存</button>
      <button id="test-btn" class="btn btn-secondary" disabled>接続テスト</button>
      <button id="cancel-btn" class="btn btn-secondary">キャンセル</button>
    </div>
  </div>

  <div id="toast">設定を保存しました</div>

  <script src="options.js"></script>
</body>
</html>
