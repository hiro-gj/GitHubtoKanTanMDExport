<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title data-i18n="pageTitle">KanTanMarkdown Conversion Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f6f8fa;
      color: #24292f;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid #d0d7de;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .radio-group {
      margin-bottom: 8px;
    }
    .radio-group label {
      display: inline-block;
      font-weight: normal;
      margin-right: 15px;
      cursor: pointer;
    }
    .radio-group label.radio-disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .radio-group label.radio-disabled input {
      cursor: not-allowed;
    }
    .text-input {
      width: 100%;
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-sizing: border-box;
      margin-top: 4px;
    }
    .text-input:disabled {
      background-color: #f6f8fa;
      color: #57606a;
      cursor: not-allowed;
    }
    .button-group {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(27, 31, 36, 0.15);
    }
    .btn-primary {
      color: #ffffff;
      background-color: #2da44e;
    }
    .btn-primary:hover {
      background-color: #2c974b;
    }
    .btn-secondary {
      color: #24292f;
      background-color: #f6f8fa;
    }
    .btn-secondary:hover {
      background-color: #f3f4f6;
    }
    .btn-secondary:disabled {
      color: #8c959f;
      cursor: not-allowed;
    }
    #test-result {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .success {
      color: #1a7f37;
    }
    .error {
      color: #cf222e;
    }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #24292f;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .info-link {
      font-size: 13px;
      color: #0969da;
      text-decoration: none;
      display: block;
      margin-top: -12px;
      margin-bottom: 20px;
    }
    .info-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="page-title" data-i18n="pageTitle">KanTanMarkdown Conversion Extension Settings</h1>
    <a href="https://github.com/tatesuke/KanTanMarkdown" target="_blank" class="info-link" id="official-repo-link" data-i18n="officialRepoLink">KanTanMarkdown Original Repository (Archived) here</a>

    <!-- 言語選択セクション -->
    <div class="form-group">
      <label id="label-language" data-i18n="labelLanguage">Language</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="language" value="en" checked> <span id="label-lang-en">English</span>
        </label>
        <label>
          <input type="radio" name="language" value="ja"> <span id="label-lang-ja">日本語</span>
        </label>
      </div>
    </div>

    <!-- かんたんMarkdownリポジトリ選択セクション -->
    <div class="form-group">
      <label id="label-repo-type" data-i18n="labelRepoType">KanTanMarkdown Repository Selection</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="repo_type" value="original"> <span id="label-repo-original" data-i18n="repoOriginal">Original (tatesuke)</span>
        </label>
        <label>
          <input type="radio" name="repo_type" value="fork" checked> <span id="label-repo-fork" data-i18n="repoFork">Fork (hiro-gj)</span>
        </label>
        <label>
          <input type="radio" name="repo_type" value="custom"> <span id="label-repo-custom" data-i18n="repoCustom">Other (Custom Repository URL)</span>
        </label>
      </div>
      <input type="text" id="custom_repo_url" class="text-input" value="https://github.com/hiro-gj/KanTanMarkdown" placeholder="https://github.com/username/repository">
      <div id="test-result"></div>
    </div>

    <!-- エディション選択セクション -->
    <div class="form-group">
      <label id="label-edition" data-i18n="labelEdition">Edition Selection</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="edition" value="lite" checked> <span id="label-edition-lite" data-i18n="editionLite">Lite Edition</span>
        </label>
        <label>
          <input type="radio" name="edition" value="standard"> <span id="label-edition-standard" data-i18n="editionStandard">Standard Edition</span>
        </label>
        <label>
          <input type="radio" name="edition" value="full"> <span id="label-edition-full" data-i18n="editionFull">Full Edition</span>
        </label>
      </div>
    </div>

    <!-- 操作ボタン群 -->
    <div class="button-group">
      <button id="save-btn" class="btn btn-primary" data-i18n="btnSave">Save</button>
      <button id="test-btn" class="btn btn-secondary" data-i18n="btnTest">Test Connection</button>
      <button id="cancel-btn" class="btn btn-secondary" data-i18n="btnCancel">Cancel</button>
    </div>
  </div>

  <div id="toast" data-i18n="toastSaved">Settings saved successfully</div>

  <script src="options.js"></script>
</body>
</html>
