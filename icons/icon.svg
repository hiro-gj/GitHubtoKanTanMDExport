<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <defs>
    <!-- 背景グラデーション (GitHub Dark) -->
    <linearGradient id="bgB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    
    <!-- ピルバッジ グラデーション (GitHub Green) -->
    <linearGradient id="greenB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    
    <!-- ドロップシャドウ -->
    <filter id="shadowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. 背景角丸スクエア -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgB)" stroke="#444c56" stroke-width="2"/>

  <!-- 2. 上部: かんたん バッジ -->
  <rect x="24" y="16" width="80" height="24" rx="12" fill="url(#greenB)" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="url(#shadowB)"/>
  <text x="64" y="33" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif" 
        font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">かんたん</text>

  <!-- 3. 下部: 左に Gitブランチシンボル (GitHubの出自) -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadowB)">
    <!-- 本線 -->
    <line x1="22" y1="58" x2="22" y2="94"/>
    <!-- 分岐線 -->
    <path d="M 22 84 C 22 72 36 72 36 66 L 36 58"/>
    <!-- ノード (丸) -->
    <circle cx="22" cy="56" r="3.5" fill="#ffffff"/>
    <circle cx="22" cy="94" r="3.5" fill="#ffffff"/>
    <circle cx="36" cy="56" r="3.5" fill="#3fb950" stroke="#3fb950"/>
  </g>

  <!-- 4. 中間: 変換を表す右矢印 → (グレー) -->
  <path d="M 44 75 L 52 75 M 49 71 L 53 75 L 49 79" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 5. 右側: Markdown M↓ -->
  <!-- M (白) -->
  <path d="M 60 96 L 60 56 L 69 56 L 78 72 L 87 56 L 96 56 L 96 96 L 87 96 L 87 74 L 78 90 L 69 74 L 69 96 Z" 
        fill="#ffffff" filter="url(#shadowB)"/>
  <!-- ↓ エクスポートアロー (グリーン) -->
  <path d="M 104 56 L 112 56 L 112 76 L 119 76 L 108 96 L 97 76 L 104 76 Z" 
        fill="#3fb950" filter="url(#shadowB)"/>
</svg>